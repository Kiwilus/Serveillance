services:
  backend:
    build:
      context: ./src
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app
      - /app/.venv

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
